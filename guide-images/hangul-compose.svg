<svg xmlns="http://www.w3.org/2000/svg" width="360" height="412" viewBox="0 0 360 412"><rect width="100%" height="100%" rx="18" fill="#f0f6f3"/><g font-family="Arial, Hiragino Sans, Apple SD Gothic Neo, sans-serif" fill="#223b31"><text x="24" y="38" font-size="24" fill="#1b6b45" text-anchor="start">「한」を入力してみよう</text><rect x="18" y="62" width="324" height="92" rx="12" fill="white" stroke="#c4d8cc"/><text x="40" y="93" font-size="19" fill="#223b31" text-anchor="start">1　ㅎ を押す</text><text x="270" y="121" font-size="44" fill="#1b6b45" text-anchor="middle">ㅎ</text><text x="40" y="128" font-size="17" fill="#223b31" text-anchor="start">子音</text><rect x="18" y="172" width="324" height="92" rx="12" fill="white" stroke="#c4d8cc"/><text x="40" y="203" font-size="19" fill="#223b31" text-anchor="start">2　ㅏ を押す</text><text x="270" y="231" font-size="44" fill="#1b6b45" text-anchor="middle">하</text><text x="40" y="238" font-size="17" fill="#223b31" text-anchor="start">母音を足す</text><rect x="18" y="282" width="324" height="92" rx="12" fill="white" stroke="#c4d8cc"/><text x="40" y="313" font-size="19" fill="#223b31" text-anchor="start">3　ㄴ を押す</text><text x="270" y="341" font-size="44" fill="#1b6b45" text-anchor="middle">한</text><text x="40" y="348" font-size="17" fill="#223b31" text-anchor="start">パッチムを足す</text></g></svg>