<svg xmlns="http://www.w3.org/2000/svg" width="360" height="388" viewBox="0 0 360 388"><rect width="100%" height="100%" rx="18" fill="#f0f6f3"/><g font-family="Arial, Hiragino Sans, Apple SD Gothic Neo, sans-serif" fill="#223b31"><text x="24" y="38" font-size="23" fill="#1b6b45" text-anchor="start">iPhone：韓国語を追加</text><rect x="18" y="64" width="324" height="61" rx="10" fill="white" stroke="#c4d8cc"/><circle cx="43" cy="94" r="16" fill="#1b6b45"/><text x="43" y="101" font-size="19" fill="white" text-anchor="middle">1</text><text x="70" y="90" font-size="18" fill="#223b31" text-anchor="start">設定 → 一般</text><text x="70" y="114" font-size="18" fill="#223b31" text-anchor="start">→ キーボード</text><text x="180" y="141" font-size="19" fill="#1b6b45" text-anchor="middle">↓</text><rect x="18" y="142" width="324" height="61" rx="10" fill="white" stroke="#c4d8cc"/><circle cx="43" cy="172" r="16" fill="#1b6b45"/><text x="43" y="179" font-size="19" fill="white" text-anchor="middle">2</text><text x="70" y="168" font-size="18" fill="#223b31" text-anchor="start">もう一度</text><text x="70" y="192" font-size="18" fill="#223b31" text-anchor="start">「キーボード」を選ぶ</text><text x="180" y="219" font-size="19" fill="#1b6b45" text-anchor="middle">↓</text><rect x="18" y="220" width="324" height="61" rx="10" fill="white" stroke="#c4d8cc"/><circle cx="43" cy="250" r="16" fill="#1b6b45"/><text x="43" y="257" font-size="19" fill="white" text-anchor="middle">3</text><text x="70" y="246" font-size="18" fill="#223b31" text-anchor="start">新しいキーボードを追加</text><text x="70" y="270" font-size="18" fill="#223b31" text-anchor="start">→ 韓国語</text><text x="180" y="297" font-size="19" fill="#1b6b45" text-anchor="middle">↓</text><rect x="18" y="298" width="324" height="61" rx="10" fill="white" stroke="#c4d8cc"/><circle cx="43" cy="328" r="16" fill="#1b6b45"/><text x="43" y="335" font-size="19" fill="white" text-anchor="middle">4</text><text x="70" y="324" font-size="18" fill="#223b31" text-anchor="start">配列を選んで完了</text><text x="70" y="348" font-size="18" fill="#223b31" text-anchor="start">この図では「標準」を使用</text></g></svg>